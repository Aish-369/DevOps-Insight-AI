name: Phase 1 Playwright Dependency Setup

on:
  push:
    branches:
      - codex/phase1-foundation-2026-11-24

permissions:
  contents: write

concurrency:
  group: phase1-playwright-dependency-setup
  cancel-in-progress: false

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Add pinned Playwright test dependency
        run: npm --prefix frontend install --save-dev --save-exact @playwright/test
      - name: Synchronize root manifest and lockfile
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const frontend = JSON.parse(fs.readFileSync("frontend/package.json", "utf8"));
          root.dependencies = frontend.dependencies;
          root.devDependencies = frontend.devDependencies;
          fs.writeFileSync("package.json", JSON.stringify(root, null, 2) + "\n");
          NODE
          cp frontend/package-lock.json package-lock.json
          cmp --silent package-lock.json frontend/package-lock.json
      - name: Commit generated dependency manifests and lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin Playwright browser test dependency"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Clean installation
        working-directory: frontend
        run: npm ci
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Browser regression tests
        working-directory: frontend
        run: npm run test:e2e
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Strict TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
