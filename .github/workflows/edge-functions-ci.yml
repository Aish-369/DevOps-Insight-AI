name: Edge Functions CI

on:
  push:
    branches:
      - codex/phase3-platform-backend-2026-11-24
  pull_request:
    branches:
      - codex/phase2-auth-lifecycle-2026-11-24
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-quality:
    name: Deno Edge Function checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
          cache: true
      - name: Install locked Deno dependencies
        run: deno install --frozen
      - name: Check TypeScript
        run: deno task check
      - name: Lint Edge Functions
        run: deno task lint
      - name: Check formatting
        run: deno task fmt:check
      - name: Run unit tests
        run: deno task test
