name: One-time Deno format bootstrap

on:
  push:
    branches:
      - codex/phase3-platform-backend-2026-11-24

permissions:
  contents: write

concurrency:
  group: phase3-deno-format-once
  cancel-in-progress: false

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
          cache: true
      - name: Format and verify
        run: |
          deno fmt .
          deno task check
          deno task lint
          deno task test
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/*.ts'
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply Deno formatter to backend"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
