name: Frontend CI

on:
  push:
    branches:
      - main
      - codex/phase1-foundation-2026-11-24
      - codex/phase2-auth-lifecycle-2026-11-24
      - codex/phase3-platform-backend-2026-11-24
  pull_request:
    branches:
      - main
      - codex/phase1-foundation-2026-11-24
      - codex/phase2-auth-lifecycle-2026-11-24
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Non-production localhost-only values allow deterministic CI builds.
      # Playwright uses the same test-only Supabase URL/key in its web server.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJyb2xlIjoiYW5vbiJ9.ci-placeholder
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Check Vite security floor
        run: npm run security:check
      - name: Run foundation tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e
      - name: Run ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
