
# DevOps Insight AI - Frontend CI Pipeline

name: Frontend CI

# Run automatically when code is pushed or a PR is opened.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Download repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install dependencies from lockfile.
      - name: Install dependencies
        run: npm ci

      # Check TypeScript and create production build.
      - name: Build frontend
        run: npm run build
