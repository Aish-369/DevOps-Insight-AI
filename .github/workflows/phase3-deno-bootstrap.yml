name: Deno Dependency and Formatting Bootstrap

on:
  push:
    branches:
      - codex/phase3-platform-backend-2026-11-24

permissions:
  contents: write

concurrency:
  group: phase3-deno-bootstrap
  cancel-in-progress: false

jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
          cache: true
      - name: Generate lockfile and format source
        run: |
          deno install
          deno fmt .
      - name: Typecheck Edge Functions
        run: deno task check
      - name: Lint Edge Functions
        run: deno task lint
      - name: Run unit tests
        run: deno task test
      - name: Commit Deno lockfile and formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deno.lock '**/*.ts'
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock and format Supabase Edge Functions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
